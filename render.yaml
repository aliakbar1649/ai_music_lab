services:
  - type: web
    name: ai-music-lab
    runtime: python
    rootDir: backend  # این دستور کلید حل مشکل شماست
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -w 4 -k uvicorn.workers.UvicornWorker app.main:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: WEB_CONCURRENCY
        value: "4"
